[package]
name = "claude-usage-mqtt"
description = "Daemon that polls Claude Code usage windows and publishes them to MQTT."
readme = "../../README.md"
keywords = ["claude", "mqtt", "usage"]
categories = ["command-line-utilities"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
claude-usage-mqtt-core = { version = "0.1.0", path = "../claude-usage-mqtt-core" }
anyhow = { workspace = true }
clap = { workspace = true }
jiff = { workspace = true }
# SIGTERM-before-SIGKILL when winding down a refresh child; tokio only offers kill.
libc = { workspace = true }
reqwest = { workspace = true }
rumqttc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# An empty working directory for each refresh child.
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
# `start_paused` for the rehydration-timeout test: a 5s budget with no wall clock.
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }
