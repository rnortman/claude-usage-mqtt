[workspace]
members = [
    "crates/claude-usage-mqtt-core",
    "crates/claude-usage-mqtt",
    "crates/claude-usage-mqtt-client",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/rnortman/claude-usage-mqtt"

[workspace.dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive", "env"] }
jiff = { version = "0.2.32", features = ["serde"] }
libc = "0.2.180"
reqwest = { version = "0.13.4", features = ["json"] }
rumqttc = { version = "0.25.1", features = ["use-rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "process"] }
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
futures = "0.3.32"
tempfile = "3.27.0"
wiremock = "0.6.5"
