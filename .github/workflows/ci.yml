name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the toolchain and its rustfmt/clippy.
      - name: Install Rust
        run: rustup toolchain install

      # The e2e tests spawn a real mosquitto. Under CI they fail rather than
      # skip when it is missing or will not start; installing it here is what
      # lets them run at all.
      - name: Install mosquitto
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          command -v mosquitto
          mosquitto --help | head -1

      - run: make rust-check

  scrub:
    name: scrub
    uses: rnortman/brenn-scrub/.github/workflows/tree-scan.yml@v0.1.0
